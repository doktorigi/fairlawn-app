name: Refresh feeds
on:
  schedule: [{ cron: '17 */3 * * *' }]   # every 3 hours
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/update_feeds.py --test && python tools/update_feeds.py
      - name: Commit feed if changed
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || (git commit -m "Refresh feeds [skip ci]" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - uses: actions/deploy-pages@v4
